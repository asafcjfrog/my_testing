name: "Frogbot Scan Pull Request"

# Scans every PR with JFrog Frogbot v3 and fails the check if the repo's Xray
# security policy (severity threshold configured in the JFrog platform, not
# here) is violated. Uses pull_request_target (not pull_request) per JFrog's
# own guidance, so secrets aren't exposed to code from a forked PR - Frogbot
# still checks out and scans the PR's actual head commit.
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read
  security-events: write

env:
  # Same virtual repo as jfrog-demo.yml.
  JFROG_NPM_REPO: npm-forrester-ads-virtual

jobs:
  scan-pull-request:
    runs-on: ubuntu-latest
    environment: frogbot
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v5

      - name: "Frogbot Scan Pull Request"
        uses: jfrog/frogbot@v3
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
