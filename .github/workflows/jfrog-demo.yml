name: "JFrog Demo Build"

# Dedicated build for the Forrester demo. Kept separate from release.yml on purpose:
# that pipeline is OWASP's real release process (tag-triggered, pushes to the
# public bkimminich/juice-shop Docker Hub image) and shouldn't be touched for a demo run.
on:
  workflow_dispatch:
  push:
    branches:
      - demo

env:
  BUILD_NAME: asafc_my_testing
  # Both are virtual repos with a Default Deployment Repository configured
  # (a local behind each one) - jf npm publish / jf docker push land there.
  JFROG_DOCKER_REPO: docker-forrester-ads-virtual
  JFROG_NPM_REPO: npm-forrester-ads-virtual

jobs:
  frogbot-scan:
    runs-on: ubuntu-latest
    environment: frogbot
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v5

      - name: "Setup JFrog CLI"
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e #v5.1.0
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}

      - name: "Configure npm to resolve through Artifactory"
        run: |
          jf npm-config --repo-resolve="$JFROG_NPM_REPO"
          cd frontend
          jf npm-config --repo-resolve="$JFROG_NPM_REPO"

      # Same reason as in jfrog-pr-scan.yml: no committed lock files, so
      # generate one for Frogbot's SCA scan to resolve against - via jf so
      # the resolution itself goes through Artifactory too.
      - name: "Install dependencies (no committed lock files)"
        run: |
          jf npm install --package-lock-only
          cd frontend
          jf npm install --package-lock-only

      # Triggered outside a pull_request event, so this runs Frogbot's
      # "scan repository" mode against the checked-out branch: it fails the
      # job on policy violations (the same "high or above" gate as the PR
      # scan) and, if fixable issues are found, opens automated fix PRs
      # against this repo. Expect that side effect during the demo.
      - name: "Frogbot Scan Repository"
        uses: jfrog/frogbot@v3
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish:
    needs: frogbot-scan
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          fetch-depth: 0

      - name: "Use Node.js 24"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 24

      # Reads JF_URL / JF_USER / JF_PASSWORD from env and auto-configures the
      # CLI's default server - no manual `jf c add` or npmrc hacking needed.
      - name: "Setup JFrog CLI"
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e #v5.1.0
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}

      - name: "Set build number"
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: "Configure npm to resolve/deploy through Artifactory"
        run: |
          jf npm-config --repo-resolve="$JFROG_NPM_REPO" --repo-deploy="$JFROG_NPM_REPO"
          cd frontend
          jf npm-config --repo-resolve="$JFROG_NPM_REPO"

      # --ignore-scripts on the root install skips its postinstall (which
      # would otherwise install frontend/ deps from the public registry) -
      # the frontend install right after does that step through Artifactory
      # instead, so both installs are captured in build info.
      - name: "Install dependencies via Artifactory (captured in build info)"
        run: |
          jf npm install --ignore-scripts --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cd frontend
          jf npm install --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: "Build application"
        run: npm run build

      - name: "Publish npm package to Artifactory"
        run: jf npm publish --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: "Collect build info: git + environment"
        run: |
          jf rt build-add-git "$BUILD_NAME" "$BUILD_NUMBER"
          jf rt build-collect-env "$BUILD_NAME" "$BUILD_NUMBER"

      # jf docker build/push perform the registry login automatically using
      # the CLI's configured server (--skip-login defaults to false), so no
      # separate `docker login` step is needed.
      - name: "Build Docker image"
        run: |
          REGISTRY="${{ secrets.JF_URL }}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY#http://}"
          REGISTRY="${REGISTRY%/}"
          IMAGE="$REGISTRY/$JFROG_DOCKER_REPO/juice-shop:$BUILD_NUMBER"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          jf docker build -t "$IMAGE" \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --build-arg VCS_REF="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: "Push image and attach it to build info"
        run: jf docker push "$IMAGE" --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: "Publish build info to Artifactory"
        run: jf rt build-publish "$BUILD_NAME" "$BUILD_NUMBER"

      # Scans the fully published build (npm package + docker image) with
      # Xray. --fail defaults to true: exits non-zero (failing this job) if
      # the build violates the "high or above" policy/watch assigned to it.
      - name: "Xray build scan"
        run: jf rt build-scan "$BUILD_NAME" "$BUILD_NUMBER"
